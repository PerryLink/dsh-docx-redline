<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-docx-redline part-wise roundtrip: a local DOCX passes the path allowlist and ZIP limits, doc.inspect hashes the nine parts and counts the structure, doc.roundtrip copies the package and compares the same parts, and the middle seam ends in zero_diff; paragraph diff, exact replace, revision summary and relationship check stay on the read-only side">
